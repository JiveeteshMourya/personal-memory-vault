[fmt]
singleQuote = false
bracketSpacing = true
semi = true
trailingComma = "es5"
printWidth = 100
tabWidth = 2
arrowParens = "avoid"


# bun fmt also skips everything in .gitignore (node_modules, .next, .env, ...).
# .claude/skills holds vendored agent skills tracked by skills-lock.json; keep them byte-identical to upstream.
# drizzle holds migrations generated by drizzle-kit; keep them exactly as generated.
ignorePatterns = ["*.env", ".env", ".env.*", "public", ".claude/skills", "drizzle"]

[test]
preload = ["./test/setup.ts"]
